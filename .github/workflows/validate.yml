name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py --output /tmp/apple-workflow-skills.zip
